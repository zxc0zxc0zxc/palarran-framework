name: Validate Palarran
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare patched SQLite only when the runner library is unsupported
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'from packages.core.coordination.service import supported_sqlite; import sys; sys.exit(0 if supported_sqlite() else 1)'; then
            exit 0
          fi
          source_archive="${RUNNER_TEMP}/palarran-sqlite-3510300.zip"
          sqlite_output="${RUNNER_TEMP}/palarran-sqlite-3510300"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 --output "$source_archive" https://sqlite.org/2026/sqlite-amalgamation-3510300.zip
          python3 packages/core/coordination/build_sqlite.py --build --archive "$source_archive" --output "$sqlite_output"
          printf 'LD_LIBRARY_PATH=%s\n' "$sqlite_output" >> "$GITHUB_ENV"
      - name: Validate repository contracts and local links
        run: python3 scripts/validate_repo.py
      - name: Test inventory, packaging and runtime offline
        run: python3 -m unittest discover -s tests -v
      - name: Exercise disposable runtime and control-plane SLO
        run: python3 scripts/factory_acceptance.py
      - name: Compile Python files
        run: python3 -m py_compile scripts/infra_inventory.py scripts/validate_repo.py scripts/package_plugin.py scripts/backend_progress.py scripts/execution_progress.py scripts/ml_cost.py orchestrator/*.py
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Format and validate provider schema without a backend or cloud access
        working-directory: templates/infra/terraform-hcloud
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
