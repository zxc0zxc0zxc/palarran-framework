name: Validate infrastructure toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository contracts and local links
        run: python3 scripts/validate_repo.py
      - name: Test inventory safety without SSH
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python files
        run: python3 -m py_compile scripts/infra_inventory.py scripts/validate_repo.py
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Format and validate provider schema without a backend or cloud access
        working-directory: templates/infra/terraform-hcloud
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
