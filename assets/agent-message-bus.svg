<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="Shared work, without mixed contexts."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4a4a5" stroke-width="1.3"/></marker></defs><rect width="1800" height="1060" rx="32" fill="#0b0b0c"/><g font-family="Arial, Helvetica, sans-serif"><text x="72" y="81" fill="#efeee9" font-size="22" letter-spacing="5">PALARRAN</text><text x="72" y="147" fill="#efeee9" font-size="44" font-weight="600">Shared work, without mixed contexts.</text><text x="72" y="190" fill="#a4a4a5" font-size="21">Developers keep their own agents; repository topics connect the right participants.</text><rect x="60" y="270" width="410" height="210" rx="18" fill="#111113" stroke="#343437"/><text x="88" y="314" fill="#efeee9" font-size="26" font-weight="600">Developer A / agents</text><text x="88" y="356" fill="#a4a4a5" font-size="20">Repository A identity</text><text x="88" y="388" fill="#a4a4a5" font-size="20">Status · questions · blockers</text><text x="88" y="420" fill="#a4a4a5" font-size="20">Private cursor + receiver</text><rect x="1330" y="270" width="410" height="210" rx="18" fill="#111113" stroke="#343437"/><text x="1358" y="314" fill="#efeee9" font-size="26" font-weight="600">Developer B / agents</text><text x="1358" y="356" fill="#a4a4a5" font-size="20">Same repository A identity</text><text x="1358" y="388" fill="#a4a4a5" font-size="20">Separate workstation + identity</text><text x="1358" y="420" fill="#a4a4a5" font-size="20">Private cursor + receiver</text><rect x="590" y="250" width="620" height="350" rx="18" fill="#111113" stroke="#343437"/><text x="618" y="294" fill="#efeee9" font-size="26" font-weight="600">Private VPS / message bus</text><text x="618" y="336" fill="#a4a4a5" font-size="20">Authenticated, project-scoped API</text><text x="618" y="368" fill="#a4a4a5" font-size="20">Repository A topic</text><text x="618" y="400" fill="#a4a4a5" font-size="20">Durable ordered messages + receipts</text><text x="618" y="432" fill="#a4a4a5" font-size="20">Poll every 30–60 seconds</text><text x="618" y="464" fill="#a4a4a5" font-size="20">Alerts stay inside this repository</text><path d="M470 340 L590 340" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M590 420 L470 420" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M1210 340 L1330 340" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M1330 420 L1210 420" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="710" width="620" height="160" rx="18" fill="#111113" stroke="#343437"/><text x="618" y="754" fill="#efeee9" font-size="26" font-weight="600">Repository B / isolated topic</text><text x="618" y="796" fill="#a4a4a5" font-size="20">Different approved project scope</text><text x="618" y="828" fill="#a4a4a5" font-size="20">No accidental cross-repository recall</text><path d="M900 610 L900 685" fill="none" stroke="#343437" stroke-width="2" stroke-dasharray="7 8"/><text x="72" y="975" fill="#a4a4a5" font-size="22">Receipt ≠ handled. Message ≠ authorization. Receiver inbox ≠ automatic model wakeup.</text></g></svg>
