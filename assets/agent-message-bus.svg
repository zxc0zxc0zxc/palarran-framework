<text x="70" y="960" fill="#efeee9" font-size="22" font-weight="400">Messages inform. The authority assigns. Independent checks accept.</text>
<text x="70" y="1004" fill="#a4a4a5" font-size="19" font-weight="400">No ACK grants approval. Stale ownership and unknown actions require reconciliation before overlapping work continues.</text>
