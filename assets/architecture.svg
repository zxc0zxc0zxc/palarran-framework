<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="One project. Shared context. Durable experience."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4a4a5" stroke-width="1.3"/></marker></defs><rect width="1800" height="1060" rx="32" fill="#0b0b0c"/><g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="81" fill="#efeee9" font-size="22" letter-spacing="5">PALARRAN</text>
<text x="72" y="147" fill="#efeee9" font-size="44" font-weight="600">One project. Shared context. Durable experience.</text>
<text x="72" y="186" fill="#a4a4a5" font-size="21">Local project authority, optional external sources, and private cross-project memory.</text>
<rect x="70" y="240" width="440" height="610" rx="18" fill="#111113" stroke="#343437"/>
<text x="98" y="277" fill="#a4a4a5" font-size="15" font-weight="600">01 / TARGET REPOSITORY</text>
<text x="98" y="318" fill="#efeee9" font-size="28" font-weight="600">Your project</text>
<text x="98" y="361" fill="#a4a4a5" font-size="20" font-weight="400">Application code and tests</text>
<text x="98" y="395" fill="#a4a4a5" font-size="20" font-weight="400">API and deployment contracts</text>
<text x="98" y="429" fill="#a4a4a5" font-size="20" font-weight="400"></text>
<text x="98" y="463" fill="#a4a4a5" font-size="20" font-weight="400">.palarran/</text>
<text x="98" y="497" fill="#a4a4a5" font-size="20" font-weight="400">Plans, ADRs and progress</text>
<text x="98" y="531" fill="#a4a4a5" font-size="20" font-weight="400">UX/UI concepts and findings</text>
<text x="98" y="565" fill="#a4a4a5" font-size="20" font-weight="400">Project language/package config</text>
<text x="98" y="599" fill="#a4a4a5" font-size="20" font-weight="400"></text>
<text x="98" y="633" fill="#a4a4a5" font-size="20" font-weight="400">.delivery/</text>
<text x="98" y="667" fill="#a4a4a5" font-size="20" font-weight="400">Current deployment configuration</text>
<rect x="580" y="240" width="570" height="345" rx="18" fill="#111113" stroke="#343437"/>
<text x="608" y="277" fill="#a4a4a5" font-size="15" font-weight="600">02 / LOCAL WORKSPACE</text>
<text x="608" y="318" fill="#efeee9" font-size="28" font-weight="600">Agent + Palarran</text>
<text x="608" y="361" fill="#a4a4a5" font-size="20" font-weight="400">Codex or Claude</text>
<text x="608" y="395" fill="#a4a4a5" font-size="20" font-weight="400">Selected skills + mandatory guides</text>
<text x="608" y="429" fill="#a4a4a5" font-size="20" font-weight="400">Context: AGENTS, ADRs, code, sources</text>
<text x="608" y="463" fill="#a4a4a5" font-size="20" font-weight="400">Optional bounded workflow runtime</text>
<text x="608" y="497" fill="#a4a4a5" font-size="20" font-weight="400">Independent verification + accounting</text>
<rect x="1220" y="240" width="510" height="220" rx="18" fill="#111113" stroke="#343437"/>
<text x="1248" y="277" fill="#a4a4a5" font-size="15" font-weight="600">03 / OPTIONAL WEB CONTEXT</text>
<text x="1248" y="318" fill="#efeee9" font-size="28" font-weight="600">Keenable MCP</text>
<text x="1248" y="361" fill="#a4a4a5" font-size="20" font-weight="400">Search and fetch primary sources</text>
<text x="1248" y="395" fill="#a4a4a5" font-size="20" font-weight="400">Separate provider quota</text>
<text x="1248" y="429" fill="#a4a4a5" font-size="20" font-weight="400">No implicit paid extraction</text>
<rect x="1220" y="535" width="510" height="315" rx="18" fill="#111113" stroke="#343437"/>
<text x="1248" y="572" fill="#a4a4a5" font-size="15" font-weight="600">04 / YOUR VPS</text>
<text x="1248" y="613" fill="#efeee9" font-size="28" font-weight="600">Long-term memory</text>
<text x="1248" y="656" fill="#a4a4a5" font-size="20" font-weight="400">Authenticated service via SSH tunnel</text>
<text x="1248" y="690" fill="#a4a4a5" font-size="20" font-weight="400">Neo4j Community: graph + fulltext</text>
<text x="1248" y="724" fill="#a4a4a5" font-size="20" font-weight="400">Private artifacts addressed by hash</text>
<text x="1248" y="758" fill="#a4a4a5" font-size="20" font-weight="400"></text>
<text x="1248" y="792" fill="#a4a4a5" font-size="20" font-weight="400">Bounded recall → applicability</text>
<text x="1248" y="826" fill="#a4a4a5" font-size="20" font-weight="400">Verified findings → dedup → review</text>
<rect x="580" y="670" width="570" height="180" rx="18" fill="#111113" stroke="#343437"/>
<text x="608" y="707" fill="#a4a4a5" font-size="15" font-weight="600">05 / PRIVATE GLOBAL PROFILE</text>
<text x="608" y="748" fill="#efeee9" font-size="28" font-weight="600">~/.palarran/</text>
<text x="608" y="791" fill="#a4a4a5" font-size="20" font-weight="400">Config, private .env, pinned runtime</text>
<text x="608" y="825" fill="#a4a4a5" font-size="20" font-weight="400">Owner policy + dedup/accounting state</text>
<path d="M 510 408 L 580 408" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 1150 345 L 1220 345" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 1150 505 L 1185 505 L 1185 665 L 1220 665" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 865 670 L 865 585" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="72" y="926" fill="#a4a4a5" font-size="15" font-weight="600">CONTROL BOUNDARIES</text>
<text x="72" y="968" fill="#efeee9" font-size="22" font-weight="400">Project sources remain authoritative. Memory and web content provide evidence, never permissions.</text>
<text x="72" y="1006" fill="#a4a4a5" font-size="19" font-weight="400">Private keys stay local. Memory ports stay private. Native web MCP usage is outside the runtime cost ledger.</text>
</g></svg>
