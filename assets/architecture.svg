<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="One product. Many repositories. One coordinated outcome."><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4a4a5" stroke-width="1.3"/></marker></defs><rect width="1800" height="1060" rx="32" fill="#0b0b0c"/><g font-family="Arial, Helvetica, sans-serif">
<text x="70" y="75" fill="#a4a4a5" font-size="20" font-weight="400" letter-spacing="5">PALARRAN</text>
<text x="70" y="140" fill="#efeee9" font-size="40" font-weight="600">One product. Many repositories. One coordinated outcome.</text>
<text x="70" y="184" fill="#a4a4a5" font-size="21" font-weight="400">Distributed parallel engineering with bounded authority, private services and durable experience.</text>
