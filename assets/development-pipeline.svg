<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="From an idea to a verified change."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4a4a5" stroke-width="1.3"/></marker></defs><rect width="1800" height="1060" rx="32" fill="#0b0b0c"/><g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="81" fill="#efeee9" font-size="22" letter-spacing="5">PALARRAN</text>
<text x="72" y="147" fill="#efeee9" font-size="44" font-weight="600">From an idea to a verified change.</text>
<text x="72" y="186" fill="#a4a4a5" font-size="21">Separate planning, implementation, acceptance and delivery. Carry evidence across every handoff.</text>
<rect x="70" y="245" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="98" y="282" fill="#a4a4a5" font-size="15" font-weight="600">01 / DISCOVERY</text>
<text x="98" y="323" fill="#efeee9" font-size="28" font-weight="600">Define the product</text>
<text x="98" y="366" fill="#a4a4a5" font-size="20" font-weight="400">Market, competitors and economics</text>
<text x="98" y="400" fill="#a4a4a5" font-size="20" font-weight="400">Audience, first customers and channels</text>
<text x="98" y="434" fill="#a4a4a5" font-size="20" font-weight="400">Evidence-backed MVP scope</text>
<rect x="650" y="245" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="678" y="282" fill="#a4a4a5" font-size="15" font-weight="600">02 / EXPERIENCE</text>
<text x="678" y="323" fill="#efeee9" font-size="28" font-weight="600">Design UX and UI</text>
<text x="678" y="366" fill="#a4a4a5" font-size="20" font-weight="400">Business flows and screen states</text>
<text x="678" y="400" fill="#a4a4a5" font-size="20" font-weight="400">Responsive diagrams and visual concepts</text>
<text x="678" y="434" fill="#a4a4a5" font-size="20" font-weight="400">References, tokens and assets</text>
<rect x="1230" y="245" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="1258" y="282" fill="#a4a4a5" font-size="15" font-weight="600">03 / SPECIFICATION</text>
<text x="1258" y="323" fill="#efeee9" font-size="28" font-weight="600">Plan frontend and backend</text>
<text x="1258" y="366" fill="#a4a4a5" font-size="20" font-weight="400">Versioned SDD + API/data contracts</text>
<text x="1258" y="400" fill="#a4a4a5" font-size="20" font-weight="400">Edge cases, DoD and SLO proposals</text>
<text x="1258" y="434" fill="#a4a4a5" font-size="20" font-weight="400">Task DAG and worktree ownership</text>
<rect x="1230" y="600" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="1258" y="637" fill="#a4a4a5" font-size="15" font-weight="600">04 / IMPLEMENTATION</text>
<text x="1258" y="678" fill="#efeee9" font-size="28" font-weight="600">Build from the frozen plan</text>
<text x="1258" y="721" fill="#a4a4a5" font-size="20" font-weight="400">Ready tasks in isolated worktrees</text>
<text x="1258" y="755" fill="#a4a4a5" font-size="20" font-weight="400">Review and sequential integration</text>
<text x="1258" y="789" fill="#a4a4a5" font-size="20" font-weight="400">Update implemented version + progress</text>
<rect x="650" y="600" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="678" y="637" fill="#a4a4a5" font-size="15" font-weight="600">05 / INDEPENDENT GATES</text>
<text x="678" y="678" fill="#efeee9" font-size="28" font-weight="600">Verify the actual application</text>
<text x="678" y="721" fill="#a4a4a5" font-size="20" font-weight="400">Business scenarios: browser, API, DB</text>
<text x="678" y="755" fill="#a4a4a5" font-size="20" font-weight="400">Exact subject and test evidence</text>
<text x="678" y="789" fill="#a4a4a5" font-size="20" font-weight="400">Missing checks remain NOT_RUN</text>
<rect x="70" y="600" width="500" height="240" rx="18" fill="#111113" stroke="#343437"/>
<text x="98" y="637" fill="#a4a4a5" font-size="15" font-weight="600">06 / AUTHORIZED DELIVERY</text>
<text x="98" y="678" fill="#efeee9" font-size="28" font-weight="600">Release, observe, learn</text>
<text x="98" y="721" fill="#a4a4a5" font-size="20" font-weight="400">CI/CD or explicit operator deployment</text>
<text x="98" y="755" fill="#a4a4a5" font-size="20" font-weight="400">Health checks, rollout and rollback</text>
<text x="98" y="789" fill="#a4a4a5" font-size="20" font-weight="400">Publish verified portable findings</text>
<path d="M 570 365 L 650 365" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1150 365 L 1230 365" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1480 485 L 1480 600" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1230 720 L 1150 720" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 650 720 L 570 720" fill="none" stroke="#a4a4a5" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="72" y="542" fill="#a4a4a5" font-size="21" font-weight="400">Each handoff carries source revisions, decision IDs, acceptance criteria and unresolved questions.</text>
<rect x="70" y="900" width="1660" height="98" rx="18" fill="#111113" stroke="#343437"/>
<text x="98" y="939" fill="#a4a4a5" font-size="15" font-weight="600">SHARED THROUGHOUT</text>
<text x="98" y="973" fill="#efeee9" font-size="22" font-weight="400">Decision memory • Context retrieval • Runtime budgets • Progress ledger • Failure reconciliation</text>
</g></svg>
