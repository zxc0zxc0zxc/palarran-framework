<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="Parallel work. One coherent result."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4a4a5" stroke-width="1.3"/></marker></defs><rect width="1800" height="1060" rx="32" fill="#0b0b0c"/><g font-family="Arial, Helvetica, sans-serif"><text x="72" y="81" fill="#efeee9" font-size="22" letter-spacing="5">PALARRAN</text><text x="72" y="147" fill="#efeee9" font-size="44" font-weight="600">Parallel work. One coherent result.</text><text x="72" y="190" fill="#a4a4a5" font-size="21">Independent tasks run concurrently; shared state and integration have one owner.</text><rect x="520" y="250" width="760" height="180" rx="18" fill="#111113" stroke="#343437"/><text x="548" y="294" fill="#efeee9" font-size="26" font-weight="600">Coordinator / one specification</text><text x="548" y="336" fill="#a4a4a5" font-size="20">Freeze contracts, task ownership and acceptance gates.</text><text x="548" y="368" fill="#a4a4a5" font-size="20">Dispatch ready work; keep one shared progress record.</text><rect x="70" y="530" width="480" height="190" rx="18" fill="#111113" stroke="#343437"/><text x="98" y="574" fill="#efeee9" font-size="26" font-weight="600">Agent A / API</text><text x="98" y="616" fill="#a4a4a5" font-size="20">Owned worktree + branch</text><text x="98" y="648" fill="#a4a4a5" font-size="20">Contract and edge-case tests</text><rect x="660" y="530" width="480" height="190" rx="18" fill="#111113" stroke="#343437"/><text x="688" y="574" fill="#efeee9" font-size="26" font-weight="600">Agent B / interface</text><text x="688" y="616" fill="#a4a4a5" font-size="20">Owned worktree + branch</text><text x="688" y="648" fill="#a4a4a5" font-size="20">Responsive and browser checks</text><rect x="1250" y="530" width="480" height="190" rx="18" fill="#111113" stroke="#343437"/><text x="1278" y="574" fill="#efeee9" font-size="26" font-weight="600">Agent C / verification</text><text x="1278" y="616" fill="#a4a4a5" font-size="20">Independent frozen criteria</text><text x="1278" y="648" fill="#a4a4a5" font-size="20">Review integrated behavior</text><path d="M900 430 L900 480 L310 480 L310 530" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 430 L900 530" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 480 L1490 480 L1490 530" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="840" width="1100" height="150" rx="18" fill="#111113" stroke="#343437"/><text x="378" y="884" fill="#efeee9" font-size="26" font-weight="600">Sequential integration → independent acceptance</text><text x="378" y="926" fill="#a4a4a5" font-size="20">Record source commits, evidence, remaining gaps and the implemented plan revision.</text><path d="M310 720 L310 780 L600 780 L600 840" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 720 L900 840" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M1490 720 L1490 780 L1200 780 L1200 840" fill="none" stroke="#a4a4a5" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
