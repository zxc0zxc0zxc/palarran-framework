apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: App-only deployment; platform bootstrap is managed separately
  sourceRepos:
    - https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPO.git
  destinations:
    - namespace: apps
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: "", kind: ConfigMap}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_GITOPS_REPO.git
    targetRevision: REPLACE_PROTECTED_BRANCH_OR_COMMIT
    path: environments/production/web
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
