# Inert single-instance example. Run only after target review and immutable image pin.
name: palarran-memory
services:
  graph:
    image: ${NEO4J_IMAGE:?Set a verified Neo4j Community image digest}
    restart: unless-stopped
    user: "7474:7474"
    ports:
      - "127.0.0.1:17474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Private DB password required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_transaction_timeout: 10s
    volumes:
      - graph-data:/data
      - graph-logs:/logs
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  graph-data:
  graph-logs:
